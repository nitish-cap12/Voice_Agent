<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jimi — Your Travel Voice Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 45%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Floating travel icons background */
    .bg-deco {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.08;
      font-size: 42px;
    }
    .bg-deco span {
      position: absolute;
      animation: drift 20s linear infinite;
    }
    .bg-deco span:nth-child(1) { top: 10%;  left: 8%;  animation-delay: 0s;  }
    .bg-deco span:nth-child(2) { top: 25%;  left: 82%; animation-delay: -4s; }
    .bg-deco span:nth-child(3) { top: 70%;  left: 12%; animation-delay: -8s; }
    .bg-deco span:nth-child(4) { top: 55%;  left: 78%; animation-delay: -12s;}
    .bg-deco span:nth-child(5) { top: 85%;  left: 45%; animation-delay: -16s;}
    .bg-deco span:nth-child(6) { top: 15%;  left: 50%; animation-delay: -6s; }
    @keyframes drift {
      0%   { transform: translate(0,0) rotate(0deg); }
      50%  { transform: translate(30px,-20px) rotate(10deg); }
      100% { transform: translate(0,0) rotate(0deg); }
    }

    /* API Key Banner */
    #api-key-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #f59e0b;
      color: #fff;
      padding: 10px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #api-key-banner input {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      width: 320px;
      outline: none;
    }
    #api-key-banner button {
      padding: 6px 14px;
      background: #fff;
      color: #b45309;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    #api-key-banner button:hover { background: #fde68a; }

    /* Main stage */
    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      text-align: center;
      color: #fff;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 6px;
    }
    .title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 32px;
    }

    /* Jimi Avatar */
    .avatar-wrap {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 24px;
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24 0%, #f97316 60%, #ec4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 0 40px rgba(255,255,255,0.15);
      transition: transform 0.4s ease;
    }
    .avatar.speaking {
      animation: gentleBob 1.8s ease-in-out infinite;
    }
    @keyframes gentleBob {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    .halo {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      opacity: 0;
    }
    .avatar-wrap.active .halo { animation: haloPulse 2s ease-out infinite; }
    .avatar-wrap.active .halo:nth-child(3) { animation-delay: 0.7s; }
    @keyframes haloPulse {
      0%   { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.4);  opacity: 0; }
    }

    /* Status */
    .status {
      font-size: 15px;
      font-weight: 500;
      min-height: 22px;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    /* Waveform */
    .waveform {
      display: flex;
      visibility: hidden;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 48px;
      margin-bottom: 20px;
    }
    .waveform.active { visibility: visible; }
    .waveform .bar {
      width: 5px;
      background: #fff;
      border-radius: 3px;
      animation: wave 0.9s ease-in-out infinite;
    }
    .waveform .bar:nth-child(1) { animation-delay: 0s;    height: 18px; }
    .waveform .bar:nth-child(2) { animation-delay: 0.1s;  height: 32px; }
    .waveform .bar:nth-child(3) { animation-delay: 0.2s;  height: 24px; }
    .waveform .bar:nth-child(4) { animation-delay: 0.3s;  height: 40px; }
    .waveform .bar:nth-child(5) { animation-delay: 0.4s;  height: 28px; }
    .waveform .bar:nth-child(6) { animation-delay: 0.3s;  height: 36px; }
    .waveform .bar:nth-child(7) { animation-delay: 0.2s;  height: 22px; }
    .waveform .bar:nth-child(8) { animation-delay: 0.1s;  height: 30px; }
    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(0.35); }
    }

    /* Mic button */
    .mic-btn {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #0369a1;
      font-size: 38px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .mic-btn:hover  { transform: scale(1.06); }
    .mic-btn:active { transform: scale(0.94); }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      animation: listenPulse 1.4s ease-in-out infinite;
    }
    .mic-btn.thinking {
      background: linear-gradient(135deg, #facc15, #f59e0b);
      color: #fff;
      cursor: wait;
    }
    .mic-btn.speaking {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      cursor: default;
    }
    @keyframes listenPulse {
      0%, 100% { box-shadow: 0 12px 32px rgba(239,68,68,0.5); }
      50%      { box-shadow: 0 12px 48px rgba(239,68,68,0.8), 0 0 0 18px rgba(239,68,68,0.15); }
    }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }

    .lang-wrap {
      position: fixed;
      bottom: 20px; right: 20px;
      z-index: 5;
    }
    .lang-wrap select {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .lang-wrap select option { background: #1e3a8a; color: #fff; }

    .end-btn {
      position: fixed;
      bottom: 20px; left: 20px;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      z-index: 5;
    }
    .end-btn:hover { background: rgba(255,255,255,0.2); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #ef4444;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 200;
      max-width: 90vw;
      text-align: center;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="bg-deco">
  <span>✈️</span><span>🌍</span><span>🏝️</span>
  <span>🗺️</span><span>🏔️</span><span>🧳</span>
</div>

<!-- API Key Banner -->
<div id="api-key-banner">
  <span>🔑 Enter your API Key to begin:</span>
  <input type="password" id="api-key-input" placeholder="Paste API key here…" />
  <button onclick="saveApiKey()">Start</button>
</div>

<div class="stage">
  <div class="brand">Travel Voice Agent</div>
  <div class="title">Hi, I'm Jimi ✨</div>
  <div class="subtitle">Your personal travel companion</div>

  <div class="avatar-wrap" id="avatar-wrap">
    <div class="halo"></div>
    <div class="halo"></div>
    <div class="avatar" id="avatar">🧳</div>
  </div>

  <div class="status" id="status">Say hello to begin…</div>

  <div class="waveform" id="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
  </div>

  <button class="mic-btn" id="mic-btn" onclick="handleMicTap()">🎙️</button>
  <div class="hint" id="hint">Tap the mic to start the conversation</div>
</div>

<div class="lang-wrap">
  <select id="lang-select">
    <option value="en-IN">English</option>
    <option value="hi-IN">हिन्दी</option>
    <option value="bn-IN">বাংলা</option>
    <option value="gu-IN">ગુજરાતી</option>
    <option value="kn-IN">ಕನ್ನಡ</option>
    <option value="ml-IN">മലയാളം</option>
    <option value="mr-IN">मराठी</option>
    <option value="od-IN">ଓଡ଼ିଆ</option>
    <option value="pa-IN">ਪੰਜਾਬੀ</option>
    <option value="ta-IN">தமிழ்</option>
    <option value="te-IN">తెలుగు</option>
  </select>
</div>

<button class="end-btn" onclick="endConversation()">End conversation</button>

<div id="toast"></div>

<script>
  // ── Configuration ──
  const API_BASE = 'https://api.sarvam.ai';
  const STT_ENDPOINT = `${API_BASE}/speech-to-text`;
  const TTS_ENDPOINT = `${API_BASE}/text-to-speech`;
  const CHAT_ENDPOINT = `${API_BASE}/v1/chat/completions`;

  const SYSTEM_PROMPT = `You are Jimi, a warm, friendly and knowledgeable travel agent having a real-time voice conversation.

INTENT HANDLING — Categorise every user turn into one of these travel intents, then respond appropriately:
  1. DESTINATION_DISCOVERY — suggesting places to visit (by interest, season, budget, vibe).
  2. ITINERARY_PLANNING — day-by-day plans, duration advice, what-to-do lists.
  3. FLIGHTS — routes, airlines, rough timing, booking guidance.
  4. HOTELS_STAY — accommodation types, neighbourhoods, rough price ranges.
  5. VISA_DOCS — visa rules, passport validity, entry requirements.
  6. LOCAL_TIPS — food, culture, safety, transport, weather, currency, language basics.
  7. BUDGETING — rough cost estimates, ways to save.
  8. SMALL_TALK — greetings, thanks, confirmations, pleasantries.
  9. OFF_TOPIC — anything unrelated to travel.

FALLBACK & UNCERTAINTY:
  • If the user's intent is unclear or ambiguous → ask ONE short clarifying question (e.g. "Are you thinking beach, mountains, or city?").
  • If you don't know a specific fact (exact price, current schedule, live availability) → say so honestly in one line and offer a useful general guideline instead. Never invent numbers.
  • If the request is OFF_TOPIC → politely steer back: "I'm best with travel — want me to suggest a trip instead?"
  • If audio/transcript seems garbled or empty → ask them to repeat.

STYLE RULES (voice-first):
  • Reply in the SAME language the user spoke in. Never mix languages.
  • 1 to 2 short sentences maximum. This is spoken, not read.
  • No markdown, no bullet points, no lists, no emojis, no headings.
  • Sound warm and conversational — like a friend who travels a lot.
  • Remember earlier context in the conversation and build on it.
  • Never output reasoning, meta commentary, or thinking text.`;

  let API_KEY = localStorage.getItem('sarvam_api_key') || '';
  let mediaRecorder = null;
  let audioChunks = [];
  let state = 'idle'; // idle | listening | thinking | speaking
  let conversationStarted = false;
  let currentAudio = null;
  let conversationHistory = [{ role: 'system', content: SYSTEM_PROMPT }];

  // ── Init ──
  window.addEventListener('load', () => {
    if (API_KEY) {
      document.getElementById('api-key-input').value = '••••••••••••';
      hideBanner();
    }
  });

  function saveApiKey() {
    const input = document.getElementById('api-key-input').value.trim();
    if (!input || input === '••••••••••••') { showToast('Please enter a valid API key.'); return; }
    API_KEY = input;
    localStorage.setItem('sarvam_api_key', API_KEY);
    hideBanner();
  }

  function hideBanner() {
    document.getElementById('api-key-banner').style.display = 'none';
  }

  // ── Main entry point ──
  async function handleMicTap() {
    if (!API_KEY) { showToast('Please enter your API key first.'); return; }
    if (state === 'thinking') return;

    if (state === 'speaking') {
      // User wants to interrupt Jimi and speak
      stopCurrentAudio();
      await beginListening();
      return;
    }

    if (state === 'listening') {
      stopListening();
      return;
    }

    // idle
    if (!conversationStarted) {
      conversationStarted = true;
      await playGreeting();
    } else {
      await beginListening();
    }
  }

  // ── Greeting (auto-spoken by Jimi on first tap) ──
  async function playGreeting() {
    const greeting = "Hi, I'm Jimi, your travel agent. Let me know how can I help you?";
    conversationHistory.push({ role: 'assistant', content: greeting });
    setState('speaking', 'Jimi is greeting you…');
    await speak(greeting);
    // After greeting → auto-listen
    await beginListening();
  }

  // ── Listening ──
  async function beginListening() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];

      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/webm')
          ? 'audio/webm'
          : 'audio/ogg';

      mediaRecorder = new MediaRecorder(stream, { mimeType });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        processTurn();
      };
      mediaRecorder.start(100);
      setState('listening', 'Listening… speak now');
    } catch (err) {
      console.error(err);
      showToast('Microphone access denied. Please allow microphone permissions.');
      setState('idle', 'Tap the mic to try again');
    }
  }

  function stopListening() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    setState('thinking', 'Jimi is thinking…');
  }

  // ── One conversation turn: STT → LLM → TTS → auto-listen ──
  async function processTurn() {
    setState('thinking', 'Understanding you…');

    const mimeType = mediaRecorder.mimeType || 'audio/webm';
    const baseMime = mimeType.split(';')[0];
    const ext = baseMime.includes('ogg') ? 'ogg' : 'webm';
    const audioBlob = new Blob(audioChunks, { type: baseMime });

    if (audioBlob.size < 1200) {
      // Too short — likely silence
      await fallback("Sorry, I didn't catch that. Could you say it again?");
      return;
    }

    const transcript = await speechToText(audioBlob, ext, baseMime);
    if (!transcript || !transcript.trim()) {
      await fallback("I couldn't hear you clearly. Could you repeat that?");
      return;
    }

    setState('thinking', 'Jimi is thinking…');
    const reply = await chatWithLLM(transcript);
    if (!reply) {
      await fallback("I hit a small hiccup on my end. Could you try that again?");
      return;
    }

    setState('speaking', 'Jimi is speaking…');
    await speak(reply);

    // Turn-taking: auto-listen again
    await beginListening();
  }

  async function fallback(msg) {
    setState('speaking', 'Jimi is speaking…');
    await speak(msg);
    await beginListening();
  }

  // ── STT ──
  async function speechToText(audioBlob, ext, mimeType) {
    const lang = document.getElementById('lang-select').value;
    const formData = new FormData();
    formData.append('file', new File([audioBlob], `audio.${ext}`, { type: mimeType }));
    formData.append('language_code', lang);
    formData.append('model', 'saaras:v3');
    formData.append('mode', 'transcribe');

    try {
      const res = await fetch(STT_ENDPOINT, {
        method: 'POST',
        headers: { 'api-subscription-key': API_KEY },
        body: formData
      });
      if (!res.ok) {
        const body = await res.text();
        console.error('STT error:', body);
        return null;
      }
      const data = await res.json();
      return data.transcript || null;
    } catch (err) {
      console.error('STT network error:', err);
      return null;
    }
  }

  // ── LLM ──
  async function chatWithLLM(userText) {
    conversationHistory.push({ role: 'user', content: userText });

    try {
      const res = await fetch(CHAT_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'api-subscription-key': API_KEY
        },
        body: JSON.stringify({
          model: 'sarvam-m',
          messages: conversationHistory,
          max_tokens: 180,
          temperature: 0.7
        })
      });

      if (!res.ok) {
        conversationHistory.pop();
        return null;
      }

      const data = await res.json();
      const raw = data.choices?.[0]?.message?.content || '';
      const reply = raw.replace(/<think>[\s\S]*?<\/think>/gi, '').trim() || null;
      if (reply) conversationHistory.push({ role: 'assistant', content: reply });
      else conversationHistory.pop();
      return reply;
    } catch (err) {
      console.error('Chat network error:', err);
      conversationHistory.pop();
      return null;
    }
  }

  // ── TTS + playback ──
  async function speak(text) {
    const lang = document.getElementById('lang-select').value;
    try {
      const res = await fetch(TTS_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'api-subscription-key': API_KEY
        },
        body: JSON.stringify({
          inputs: [text],
          target_language_code: lang,
          speaker: 'anushka',
          pitch: 0,
          pace: 1.0,
          loudness: 1.2,
          speech_sample_rate: 22050,
          enable_preprocessing: true,
          model: 'bulbul:v2'
        })
      });

      if (!res.ok) {
        const body = await res.text();
        console.error('TTS error:', body);
        return;
      }

      const data = await res.json();
      const base64Audio = data.audios?.[0];
      if (!base64Audio) return;

      const audioBytes = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0));
      const audioBlob = new Blob([audioBytes], { type: 'audio/wav' });
      const audioUrl = URL.createObjectURL(audioBlob);

      await new Promise((resolve) => {
        currentAudio = new Audio(audioUrl);
        currentAudio.onended = () => { URL.revokeObjectURL(audioUrl); currentAudio = null; resolve(); };
        currentAudio.onerror = () => { URL.revokeObjectURL(audioUrl); currentAudio = null; resolve(); };
        currentAudio.play().catch(() => resolve());
      });
    } catch (err) {
      console.error('TTS network error:', err);
    }
  }

  function stopCurrentAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
  }

  // ── UI state ──
  function setState(next, statusText) {
    state = next;
    const btn = document.getElementById('mic-btn');
    const avatarWrap = document.getElementById('avatar-wrap');
    const avatar = document.getElementById('avatar');
    const waveform = document.getElementById('waveform');
    const hint = document.getElementById('hint');

    btn.className = 'mic-btn';
    avatarWrap.classList.remove('active');
    avatar.classList.remove('speaking');
    waveform.classList.remove('active');

    switch (next) {
      case 'listening':
        btn.classList.add('listening');
        btn.textContent = '⏹️';
        avatarWrap.classList.add('active');
        waveform.classList.add('active');
        hint.textContent = 'Tap to stop';
        break;
      case 'thinking':
        btn.classList.add('thinking');
        btn.textContent = '⋯';
        hint.textContent = 'One moment…';
        break;
      case 'speaking':
        btn.classList.add('speaking');
        btn.textContent = '🔊';
        avatar.classList.add('speaking');
        avatarWrap.classList.add('active');
        hint.textContent = 'Tap to interrupt';
        break;
      default:
        btn.textContent = '🎙️';
        hint.textContent = conversationStarted
          ? 'Tap the mic to speak'
          : 'Tap the mic to start the conversation';
    }
    document.getElementById('status').textContent = statusText || '';
  }

  function endConversation() {
    stopCurrentAudio();
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    conversationStarted = false;
    conversationHistory = [{ role: 'system', content: SYSTEM_PROMPT }];
    setState('idle', 'Say hello to begin…');
    showToast('Conversation ended ✈️', 'success');
  }

  let toastTimer = null;
  function showToast(msg, type = 'error') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = type === 'success' ? '#10b981' : '#ef4444';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
  }

  document.getElementById('api-key-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveApiKey();
  });
</script>
</body>
</html>
